# Construit l'APK Android signé de l'application EDGVM (Capacitor) sur les serveurs de GitHub :
# rien à installer sur le poste. Lancement : onglet « Actions », « APK Android », « Run workflow »,
# ou en poussant une étiquette « mobile-v1.0.1 ».
#
# Secrets du dépôt (Settings > Secrets and variables > Actions), jamais dans le code :
#   ANDROID_KEYSTORE_BASE64  clé de signature edgvm-release.jks encodée en base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# Résultat : l'artefact « edgvm-apk » (edgvm.apk + version.json), à publier avec scripts/publier-apk.sh.
name: APK Android

on:
  workflow_dispatch:
    inputs:
      adresse:
        description: Adresse de la plateforme chargée par l'application
        default: https://plateforme.edgvm.mahajanga-univ.mg
        required: true
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADRESSE_PLATEFORME: ${{ github.event.inputs.adresse || 'https://plateforme.edgvm.mahajanga-univ.mg' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # Le paquet « tools » installé par défaut n'existe plus chez Google ; Gradle télécharge le reste.
          packages: 'platform-tools'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Dépendances
        working-directory: mobile
        run: npm ci

      - name: Clé de signature (depuis les secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret ANDROID_KEYSTORE_BASE64 absent." >&2; exit 1; fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/edgvm-release.jks
          printf 'storeFile=../edgvm-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > mobile/android/keystore.properties

      - name: Synchroniser le projet Android
        working-directory: mobile
        run: |
          echo "window.ADRESSE_PLATEFORME = '${ADRESSE_PLATEFORME}'" > www/adresse.js
          npx cap sync android

      - name: Construire l'APK signé
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Préparer l'artefact
        run: |
          mkdir -p sortie
          cp mobile/android/app/build/outputs/apk/release/app-release.apk sortie/edgvm.apk
          version="$(grep -m1 'versionName' mobile/android/app/build.gradle | sed -E 's/.*"(.*)".*/\1/')"
          printf '{"version":"%s","taille":%s,"construit_le":"%s"}\n' "$version" "$(stat -c %s sortie/edgvm.apk)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > sortie/version.json
          cat sortie/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: edgvm-apk
          path: sortie/
          retention-days: 30

      - name: Effacer la clé
        if: always()
        run: rm -f mobile/android/edgvm-release.jks mobile/android/keystore.properties
